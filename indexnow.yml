name: IndexNow ping

# index.html 이 main 에 푸시될 때마다 검색엔진에 변경을 알립니다.
# (Bing / Yandex / Seznam / Naver 가 하나의 엔드포인트로 함께 통지됩니다)

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:        # 액션 탭에서 수동 실행도 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # GitHub Pages 배포가 끝난 뒤에 알려야 크롤러가 새 내용을 받습니다.
      - name: Wait for Pages deployment
        run: sleep 90

      - name: Submit URLs to IndexNow
        run: |
          curl -sS -w '\nHTTP %{http_code}\n' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "healthkeeper2026-lab.github.io",
              "key": "fd062fc105dc8dc8bd6451d82e5500ad",
              "keyLocation": "https://healthkeeper2026-lab.github.io/usefulknowledge/fd062fc105dc8dc8bd6451d82e5500ad.txt",
              "urlList": ["https://healthkeeper2026-lab.github.io/usefulknowledge/"]
            }'
